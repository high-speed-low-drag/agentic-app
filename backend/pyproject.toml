[project]
name = "gridsim"
version = "0.1.0"
description = "GridSim: time-series load flow studies on power-grid-model"
authors = [
    { name = "Michael Liu", email = "104720972+michael-z-liu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "power-grid-model>=1.13.209",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gridsim = "gridsim.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
